name: Daily Signal

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: pulse
        type: choice
        options: [pulse, summary, healthcheck]
      force_run:
        description: "Bypass non-security guards"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      GITHUB_ACTOR_NAME: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run engine
        run: |
          python scripts/runner.py \
            --mode "${{ inputs.mode || 'pulse' }}" \
            --force-run "${{ inputs.force_run || 'false' }}"

      - name: Commit local changes (self mode)
        shell: bash
        run: |
          if [ ! -d runtime_target ]; then
            echo "No runtime_target found, skip local commit"
            exit 0
          fi
          TARGET_REPO=$(cat runtime_target/repo.txt)
          TARGET_MODE=$(cat runtime_target/mode.txt)
          if [ "$TARGET_MODE" != "self" ]; then
            echo "Target mode is $TARGET_MODE, skip local commit"
            exit 0
          fi
          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add logs/ .daily-signal/config.yml
          if git diff --cached --quiet; then
            echo "No local changes"
            exit 0
          fi
          git commit -m "chore(signal): automated update"
          git push

      - name: Commit cross-repo changes (profile/custom)
        shell: bash
        run: |
          if [ ! -d runtime_target ]; then
            echo "No runtime_target found, skip cross-repo commit"
            exit 0
          fi
          TARGET_REPO=$(cat runtime_target/repo.txt)
          TARGET_MODE=$(cat runtime_target/mode.txt)
          TARGET_BRANCH=$(cat runtime_target/branch.txt)
          if [ "$TARGET_MODE" = "self" ]; then
            echo "Self mode, skip cross-repo"
            exit 0
          fi
          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "TARGET_REPO_TOKEN missing for cross-repo mode"
            exit 1
          fi

          rm -rf target_repo
          git clone "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git" target_repo
          cd target_repo
          git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH"

          mkdir -p logs
          cp -r ../runtime_target/output/. logs/

          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No cross-repo changes"
            exit 0
          fi
          SLOT=$(cat ../runtime_target/slot.txt)
          MODE=$(cat ../runtime_target/run_mode.txt)
          git commit -m "chore(signal): ${MODE} ${SLOT}"
          git push origin "$TARGET_BRANCH"

      - name: Notify Telegram on failure (optional)
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          MSG="❌ Daily Signal failed on $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" >/dev/null

      - name: Notify Discord on failure (optional)
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          MSG="❌ Daily Signal failed on $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"$MSG\"}" "${DISCORD_WEBHOOK_URL}" >/dev/null
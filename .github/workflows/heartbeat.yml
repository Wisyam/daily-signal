name: Daily Signal

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: pulse
        type: choice
        options: [pulse, summary, healthcheck]
      force_run:
        description: "Bypass non-security guards"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run engine
        run: |
          python scripts/runner.py \
            --mode "${{ inputs.mode || 'pulse' }}" \
            --force-run "${{ inputs.force_run || 'false' }}"

      - name: Commit local changes (self mode)
        shell: bash
        run: |
          TARGET_MODE=$(cat runtime_target/mode.txt)
          if [ "$TARGET_MODE" != "self" ]; then
            echo "Target mode is $TARGET_MODE, skip local commit"
            exit 0
          fi
          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add logs/ .daily-signal/config.yml runtime_target/summary.json
          if git diff --cached --quiet; then
            echo "No local changes"
            exit 0
          fi
          SLOT=$(cat runtime_target/slot.txt)
          MODE=$(cat runtime_target/run_mode.txt)
          git commit -m "chore(signal): ${MODE} ${SLOT}"
          git push

      - name: Commit cross-repo changes (profile/custom)
        shell: bash
        run: |
          TARGET_REPO=$(cat runtime_target/repo.txt)
          TARGET_MODE=$(cat runtime_target/mode.txt)
          TARGET_BRANCH=$(cat runtime_target/branch.txt)
          if [ "$TARGET_MODE" = "self" ]; then
            echo "Self mode, skip cross-repo"
            exit 0
          fi
          if [ -z "$TARGET_REPO_TOKEN" ]; then
            echo "TARGET_REPO_TOKEN missing; skip cross-repo safely"
            exit 0
          fi

          rm -rf target_repo
          git clone "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git" target_repo
          cd target_repo
          git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH"
          mkdir -p logs
          cp -r ../runtime_target/output/. logs/

          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No cross-repo changes"
            exit 0
          fi
          SLOT=$(cat ../runtime_target/slot.txt)
          MODE=$(cat ../runtime_target/run_mode.txt)
          git commit -m "chore(signal): ${MODE} ${SLOT}"
          git push origin "$TARGET_BRANCH"

      - name: Prepare notification payload
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          summary = {}
          p = Path('runtime_target/summary.json')
          if p.exists():
              summary = json.loads(p.read_text(encoding='utf-8'))

          status = os.getenv('JOB_STATUS', 'unknown')
          icon = '✅' if status == 'success' else '❌'
          color = 5763719 if status == 'success' else 15548997

          repo = os.getenv('GITHUB_REPOSITORY', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')
          run_no = os.getenv('GITHUB_RUN_NUMBER', '')
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'

          tz_label = summary.get('timezone_label', summary.get('timezone', 'Local'))
          schedule_text = (
            f"• Morning: 09:00 {tz_label} (02:00 UTC)\\n"
            f"• Afternoon: 14:00 {tz_label} (07:00 UTC)\\n"
            f"• Night: 21:00 {tz_label} (14:00 UTC)"
          )

          actions = summary.get('actions', [])
          actions_text = '\\n'.join([f"• {a}" for a in actions[:10]]) if actions else '• -'

          files = summary.get('files_generated', [])
          files_text = '\\n'.join([f"• `{f.replace('runtime_target/output/','logs/')}`" for f in files[:8]]) if files else '• -'

          skipped = summary.get('skipped', False)
          skip_reason = summary.get('skip_reason', '') or '-'

          fields = [
            {"name":"📌 Execution","value":f"{icon} **{status.upper()}**\\nMode: `{summary.get('run_mode','-')}`\\nSlot: `{summary.get('slot','-')}`\\nSkipped: `{skipped}`", "inline":True},
            {"name":"🎯 Target","value":f"Repo: `{summary.get('target_repo','-')}`\\nBranch: `{summary.get('target_branch','-')}`\\nMode: `{summary.get('target_mode','-')}`", "inline":True},
            {"name":"🕒 Schedule Windows","value":schedule_text, "inline":False},
            {"name":"🧠 Actions Performed","value":actions_text, "inline":False},
            {"name":"📄 Generated Files","value":files_text, "inline":False},
            {"name":"⚠️ Skip Reason","value":f"`{skip_reason}`", "inline":False},
            {"name":"🔗 Run Details","value":f"[Open workflow run]({run_url})\\nRun #: `{run_no}`", "inline":False}
          ]

          payload = {
            "username": "Daily Signal Bot",
            "avatar_url": "https://raw.githubusercontent.com/github/explore/main/topics/github-actions/github-actions.png",
            "embeds": [{
              "title": "Daily Signal — Execution Report",
              "description": "Automated contribution heartbeat status and output summary.",
              "color": color,
              "fields": fields,
              "footer": {"text": f"{repo} • daily-signal"}
            }]
          }

          Path('runtime_target').mkdir(parents=True, exist_ok=True)
          Path('runtime_target/notify-discord.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

      - name: Notify Discord (success/failure)
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        run: |
          curl -sS -H "Content-Type: application/json" \
            --data @runtime_target/notify-discord.json \
            "${DISCORD_WEBHOOK_URL}" >/dev/null

      - name: Notify Telegram on failure (optional)
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          MSG="❌ Daily Signal failed on $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MSG" >/dev/null
name: Daily Signal

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: pulse
        type: choice
        options: [pulse, summary, healthcheck]
      force_run:
        description: "Bypass non-security guards"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run engine
        run: |
          python scripts/runner.py \
            --mode "${{ inputs.mode || 'pulse' }}" \
            --force-run "${{ inputs.force_run || 'false' }}"

      - name: Commit local changes (self mode)
        run: |
          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add logs/ .daily-signal/config.yml
          if git diff --cached --quiet; then
            echo "No local changes"
            exit 0
          fi
          git commit -m "chore(signal): automated update"
          git push

      - name: Notify Telegram on failure (optional)
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          MSG="❌ Daily Signal failed on $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" >/dev/null

      - name: Notify Discord on failure (optional)
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          MSG="❌ Daily Signal failed on $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"$MSG\"}" "${DISCORD_WEBHOOK_URL}" >/dev/null
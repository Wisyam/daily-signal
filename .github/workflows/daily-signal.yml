name: Daily Signal

on:
  schedule:
    # 09:10 WIB = 02:10 UTC
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily signal entry
        run: python scripts/heartbeat.py

      - name: Commit and push if changed
        run: |
          git config user.name "daily-signal-bot"
          git config user.email "151379934+Wisyam@users.noreply.github.com"
          git add signal/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(signal): daily heartbeat"
          git push
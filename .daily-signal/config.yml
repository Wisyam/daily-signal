version: 1
timezone: Asia/Jakarta

target:
  mode: self
  repo: ""
  branch: main

schedule:
  slots:
    - name: morning
      base_utc: "02:00"
      jitter_min: 30
    - name: afternoon
      base_utc: "07:00"
      jitter_min: 30
    - name: night
      base_utc: "14:00"
      jitter_min: 30

policy:
  max_commits_per_day: 3
  min_gap_hours: 3
  weekend_max_commits: 1
  weekend_mode: true

modules:
  pulse: true
  learning_note: true
  weekly_digest: true
  health_report: true

notifications:
  discord: optional
  telegram: optional

security:
  require_cross_repo_token: true